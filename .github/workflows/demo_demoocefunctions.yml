# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core app to Azure Function App - DemoOceFunctions

on:
  push:
    branches:
      - demo
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'AzureFunctionsApp' # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '8.0.x' # set this to the dotnet version to use

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'List Files for Debugging'
        run: |
          ls -R  # For Unix systems
          # dir /S  # If you encounter any issues, you can use this on Windows

      - name: 'Resolve Project Dependencies Using Dotnet'
        shell: pwsh
        run: |
          cd AzureFunctionsApp
          dotnet build --configuration Release --output ./output

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_260DC73666E84D7CBB2295D3FB9DC0D9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_727656B4B3C3413EBAF206F3F631FA09 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B84AD0CC1BE74F56ADEBE6A0BC933031 }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'DemoOceFunctions'
          package: './AzureFunctionsApp/output'
          

# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core app to Azure Function App - DemoOceFunctions

on:
  push:
    branches:
      - demo
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # Directorio del proyecto (ajústalo si es necesario)
  DOTNET_VERSION: '8.0.x' # Versión de .NET

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write # Necesario para solicitar el JWT

    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Setup .NET Environment
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Project
        shell: pwsh
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet build --configuration Release --output ./output
          popd

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_260DC73666E84D7CBB2295D3FB9DC0D9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_727656B4B3C3413EBAF206F3F631FA09 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B84AD0CC1BE74F56ADEBE6A0BC933031 }}

      - name: Deploy to Azure Function App
        uses: azure/functions-action@v1
        with:
          app-name: 'DemoOceFunctions'
          package: './output'

          
